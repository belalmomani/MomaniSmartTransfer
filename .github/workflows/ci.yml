name: CI

on:
  # Lets the "Run workflow" button and the GitHub API start a build by hand.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # JDK 25: Kadb ships Java 25 bytecode, so :adb tests need a 25 runtime.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # build = assemble (debug + release) + unit tests + Android lint
      # Uploads through a browser or an API drop the executable bit; exit code 126 means this.
      - run: chmod +x gradlew

      - run: ./gradlew build --console=plain

      # The debug APK of every green build, downloadable from the run's page. Debug-signed, not for release.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MomaniSmartTransfer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
